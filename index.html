<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Censor</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --red:    #e63946;
    --dark:   #0d0d0f;
    --panel:  #141417;
    --border: #2a2a30;
    --muted:  #444450;
    --text:   #f0eee8;
    --accent: #ff6b6b;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.35;
    pointer-events: none;
  }

  /* Glowing blob */
  body::after {
    content: '';
    position: fixed;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, rgba(230,57,70,0.18) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    50%       { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 90%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 42px 36px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    box-shadow: 0 0 60px rgba(230,57,70,0.08), 0 24px 48px rgba(0,0,0,0.5);
  }

  .header {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .badge {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--red);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    animation: blink 1.8s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
  }

  h2 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.1;
  }

  h2 span {
    color: var(--red);
  }

  .divider {
    height: 1px;
    background: var(--border);
  }

  .input-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  input {
    width: 100%;
    height: 48px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    padding: 0 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(230,57,70,0.12);
  }

  input::placeholder {
    color: var(--muted);
  }

  .actions {
    display: flex;
    gap: 12px;
  }

  button {
    height: 48px;
    border: none;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.12s, box-shadow 0.2s;
  }

  button:active {
    transform: scale(0.97);
  }

  .btn-primary {
    flex: 1;
    background: var(--red);
    color: #fff;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 20px rgba(230,57,70,0.3);
  }

  .btn-primary:hover {
    opacity: 0.88;
    box-shadow: 0 6px 26px rgba(230,57,70,0.45);
  }

  .btn-secondary {
    width: 96px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    letter-spacing: 0.05em;
  }

  .btn-secondary:hover {
    color: var(--text);
    border-color: var(--muted);
  }

  .output-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .output {
    min-height: 52px;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    color: #a8e6cf;
    word-break: break-word;
    transition: border-color 0.3s;
  }

  .output:not(:empty) {
    border-color: #2a3f34;
  }

  .output.censored {
    color: var(--accent);
    border-color: rgba(230,57,70,0.3);
    animation: flash 0.25s ease;
  }

  @keyframes flash {
    0%   { background: rgba(230,57,70,0.08); }
    100% { background: var(--dark); }
  }
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="badge">Active Filter</div>
    <h2>Word <span>Censor</span></h2>
  </div>

  <div class="divider"></div>

  <div class="input-wrap">
    <label>Input Text</label>
    <input type="text" id="inputText" placeholder="Type something…">
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="getCensoredWord()">Censor</button>
    <button class="btn-secondary" onclick="resetAll()">Reset</button>
  </div>

  <div class="output-wrap">
    <label>Output</label>
    <div class="output" id="outputText"></div>
  </div>

</div>

<script>
  const badWords = ["fuckkk","shit","nigga","bitch","asshole"];

  const input  = document.getElementById("inputText");
  const output = document.getElementById("outputText");

  function getCensoredWord() {
    output.classList.remove('censored');
    

    output.innerHTML = input.value.toLowerCase()
      .replaceAll('fuck',  '*****')
      .replaceAll('shit',    '****')
      .replaceAll('nigga',   '****')
      .replaceAll('bitch',   '*****')
      .replaceAll('fool', '****');

    output.classList.add('censored');
  }

  function resetAll() {
    input.value = '';
    output.innerHTML = '';
    output.classList.remove('censored');
    input.focus();
  }
</script>

</body>
</html>
